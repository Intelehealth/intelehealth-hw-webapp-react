name: 🚀 Deploy to Development

on:
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_run:
    workflows: ['🔍 Pull Request Checks']
    types: [completed]
    branches: [dev]

env:
  NODE_VERSION: '22.18.0'
  DEPLOY_ENV: 'development'

jobs:
  deploy-dev:
    name: Deploy to Development Server
    runs-on: ubuntu-latest
    environment: dev
    # Only run if PR checks passed or if triggered manually
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build for development
        run: yarn build
        env:
          VITE_APP_ENV: development
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_TIMEOUT: ${{ secrets.VITE_API_TIMEOUT }}
          VITE_ENABLE_ANALYTICS: ${{ secrets.VITE_ENABLE_ANALYTICS }}
          VITE_ENABLE_DEBUG_MODE: ${{ secrets.VITE_ENABLE_DEBUG_MODE }}

      - name: 📊 Analyze bundle
        run: yarn analyze

      - name: 🔐 Setup SSH Key
        run: |
          echo "🔐 Setting up SSH key for server access..."
          # Create .ssh directory
          mkdir -p ~/.ssh
          # Set proper permissions
          chmod 700 ~/.ssh
          # Write the private key to file
          echo "${{ secrets.SERVER_PEM_KEY }}" > ~/.ssh/dev_server.pem
          # Set proper permissions for the key file
          chmod 600 ~/.ssh/dev_server.pem
          # Add server to known hosts to avoid host key verification prompt
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          echo "✅ SSH key setup completed!"

      - name: 🧪 Test Server Connection
        run: |
          echo "🧪 Testing connection to development server..."
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'Connection successful!'"
          echo "✅ Server connection test passed!"

      - name: 🚀 Deploy to Development Server
        run: |
          echo "🚀 Deploying to development server..."

          # Validate required secrets
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "❌ Error: DEPLOY_PATH secret is not set"
            exit 1
          fi

          if [ -z "${{ secrets.BACKUP_PATH }}" ]; then
            echo "❌ Error: BACKUP_PATH secret is not set"
            exit 1
          fi

          echo "📁 Deploy path: ${{ secrets.DEPLOY_PATH }}"
          echo "📁 Backup path: ${{ secrets.BACKUP_PATH }}"

          # Create deployment directory on server
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            echo 'Creating directories...'
            mkdir -p '${{ secrets.BACKUP_PATH }}'
            mkdir -p '${{ secrets.DEPLOY_PATH }}'
            mkdir -p '${{ secrets.DEPLOY_PATH }}/temp'
            echo 'Directories created successfully!'
          "

          # Backup current deployment (if exists)
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            if [ -d '${{ secrets.DEPLOY_PATH }}' ] && [ \"\$(ls -A ${{ secrets.DEPLOY_PATH }})\" ]; then
              echo '📦 Creating backup of current deployment...'
              cp -r ${{ secrets.DEPLOY_PATH }}/* ${{ secrets.BACKUP_PATH }}/ 2>/dev/null || true
              echo '✅ Backup created successfully!'
            else
              echo 'ℹ️ No existing deployment to backup'
            fi
          "

          # Upload build files to temp directory first
          echo "📤 Uploading build files to server..."
          rsync -avz --delete -e "ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/temp/

          # Move files from temp to final location and set permissions
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            echo '🔄 Moving files to final location...'
            # Remove existing files (except temp directory)
            find '${{ secrets.DEPLOY_PATH }}' -maxdepth 1 -type f -delete 2>/dev/null || true
            find '${{ secrets.DEPLOY_PATH }}' -maxdepth 1 -type d ! -name temp ! -path '${{ secrets.DEPLOY_PATH }}' -exec rm -rf {} + 2>/dev/null || true
            
            # Move files from temp to final location
            mv '${{ secrets.DEPLOY_PATH }}/temp'/* '${{ secrets.DEPLOY_PATH }}/' 2>/dev/null || true
            rmdir '${{ secrets.DEPLOY_PATH }}/temp' 2>/dev/null || true
            
            echo '🔧 Setting proper permissions...'
            sudo chmod -R 755 '${{ secrets.DEPLOY_PATH }}/'
            sudo chown -R www-data:www-data '${{ secrets.DEPLOY_PATH }}/'
            echo '✅ Permissions set successfully!'
          "

          # Update web server configuration (if needed)
          ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            echo '🌐 Updating web server configuration...'
            # Add your web server restart commands here
            # Example for Nginx:
            # sudo systemctl reload nginx
            # Example for Apache:
            # sudo systemctl reload apache2
            echo '✅ Web server configuration updated!'
          "

          echo "✅ Development deployment completed successfully!"

      # - name: 🧪 Post-Deployment Health Check
      #   run: |
      #     echo "🧪 Running post-deployment health checks..."
      #
      #     # Wait a moment for deployment to settle
      #     sleep 10
      #
      #     # Check if the application is responding
      #     HEALTH_CHECK_URL="${{ secrets.DEV_HEALTH_CHECK_URL }}"
      #     if [ -n "$HEALTH_CHECK_URL" ]; then
      #       echo "🔍 Checking application health at: $HEALTH_CHECK_URL"
      #       HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_CHECK_URL" || echo "000")
      #
      #       if [ "$HTTP_STATUS" = "200" ]; then
      #         echo "✅ Health check passed! Application is responding correctly."
      #       else
      #         echo "⚠️ Health check failed with status: $HTTP_STATUS"
      #         echo "🔍 Checking server status..."
      #         ssh -i ~/.ssh/dev_server.pem -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
      #           echo 'Server status:'
      #           ps aux | grep -E '(nginx|apache|node)' | grep -v grep || echo 'No web server processes found'
      #           echo 'Disk space:'
      #           df -h
      #           echo 'Recent logs:'
      #           tail -n 20 /var/log/nginx/error.log 2>/dev/null || echo 'No nginx error logs found'
      #         "
      #       fi
      #     else
      #       echo "ℹ️ No health check URL configured, skipping health check"
      #     fi
      #
      #     echo "✅ Post-deployment health check completed!"

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up temporary files..."
          # Remove the private key file for security
          rm -f ~/.ssh/dev_server.pem
          echo "✅ Cleanup completed!"

      - name: 📧 Notify deployment to Slack
        if: always()
        run: |
          # Check if notifications are enabled
          if [ "${{ secrets.SEND_NOTIFICATIONS }}" = "true" ] || [ "${{ secrets.SEND_NOTIFICATIONS }}" = "1" ]; then
            echo "📧 Sending deployment notification to Slack..."

            # Determine deployment status
            if [ "${{ job.status }}" = "success" ]; then
              STATUS_EMOJI="✅"
              STATUS_COLOR="good"
              STATUS_TEXT="SUCCESS"
            else
              STATUS_EMOJI="❌"
              STATUS_COLOR="danger"
              STATUS_TEXT="FAILED"
            fi

            # Prepare Slack message
            DEPLOYMENT_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
            TIMESTAMP=$(date +%s)
            
            SLACK_MESSAGE="{\"channel\":\"${{ secrets.SLACK_CHANNEL }}\",\"username\":\"GitHub Actions\",\"icon_emoji\":\":rocket:\",\"attachments\":[{\"color\":\"$STATUS_COLOR\",\"title\":\"$STATUS_EMOJI Development Deployment $STATUS_TEXT\",\"title_link\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"fields\":[{\"title\":\"Repository\",\"value\":\"${{ github.repository }}\",\"short\":true},{\"title\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"short\":true},{\"title\":\"Commit\",\"value\":\"<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\",\"short\":true},{\"title\":\"Author\",\"value\":\"${{ github.actor }}\",\"short\":true},{\"title\":\"Environment\",\"value\":\"Development\",\"short\":true},{\"title\":\"Deployment Time\",\"value\":\"$DEPLOYMENT_TIME\",\"short\":true},{\"title\":\"Server\",\"value\":\"${{ secrets.SERVER_HOST }}\",\"short\":true}],\"footer\":\"GitHub Actions\",\"footer_icon\":\"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",\"ts\":$TIMESTAMP}]}"

            # Send notification to Slack
            curl -X POST -H 'Content-type: application/json' \
              --data "$SLACK_MESSAGE" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"

            echo "✅ Slack notification sent successfully!"
          else
            echo "🔕 Slack notifications are disabled (SEND_NOTIFICATIONS = ${{ secrets.SEND_NOTIFICATIONS }})"
          fi
