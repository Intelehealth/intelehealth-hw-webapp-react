name: 🚀 Deploy to TTXAI

# Manual deploys only (Actions tab → "Run workflow" → pick the branch).
on:
  workflow_dispatch:
    inputs:
      analyze:
        description: 'Also run the bundle analyzer (adds an extra build)'
        type: boolean
        default: false

# Never run two deploys against the same server at once
concurrency:
  group: deploy-ttxai
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22.18.0'
  DEPLOY_ENV: 'development'

jobs:
  deploy-dev:
    name: Deploy to TTXAI Server
    runs-on: ubuntu-latest
    environment: ttxai
    # Hard cap so a hung test / SSH session can't bill for hours
    timeout-minutes: 20

    steps:
      - name: ✅ Validate required secrets
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKUP_PATH: ${{ secrets.BACKUP_PATH }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PEM_KEY: ${{ secrets.SERVER_PEM_KEY }}
        run: |
          missing=0
          for name in DEPLOY_PATH BACKUP_PATH SERVER_HOST SERVER_USER SERVER_PEM_KEY; do
            if [ -z "${!name}" ]; then
              echo "❌ Error: $name secret is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # Guard against paths that would make the deploy destructive
          for name in DEPLOY_PATH BACKUP_PATH; do
            p="${!name%/}"
            case "$p" in
              ""|"/"|"/home"|"/var"|"/var/www"|"/usr"|"/etc"|"/root")
                echo "❌ Error: $name points to an unsafe location"
                exit 1 ;;
            esac
          done
          D="${DEPLOY_PATH%/}"; B="${BACKUP_PATH%/}"
          if [ "$D" = "$B" ]; then
            echo "❌ Error: DEPLOY_PATH and BACKUP_PATH must be different"
            exit 1
          fi
          case "$B/" in "$D/"*)
            echo "❌ Error: BACKUP_PATH must not be inside DEPLOY_PATH"
            exit 1 ;;
          esac
          echo "✅ All required secrets are set"

      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache node_modules itself: on a hit, `yarn install` is skipped entirely
      - name: 💾 Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock') }}

      - name: 📦 Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline

      - name: 🧪 Run tests with conditional coverage
        env:
          BYPASS_COVERAGE_CHECK: ${{ secrets.BYPASS_COVERAGE_CHECK }}
        run: |
          echo "🧪 Running tests..."
          if [ "$BYPASS_COVERAGE_CHECK" = "true" ]; then
            echo "⚠️ Coverage check bypassed - running tests without coverage requirements"
            yarn test:coverage:bypass
          else
            echo "✅ Running tests with 100% coverage requirement"
            yarn test:coverage
          fi

      # Opt-in only: the analyzer does its own full build
      - name: 📊 Analyze bundle
        if: inputs.analyze
        run: yarn analyze

      - name: 🏗️ Build for development
        env:
          VITE_APP_ENV: development
          VITE_DEBUG_MODE: 'true'
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_AUTH_GATEWAY_API_URL: ${{ vars.VITE_AUTH_GATEWAY_API_URL }}
          VITE_OPENMRS_API_URL: ${{ vars.VITE_OPENMRS_API_URL }}
          VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}
          VITE_API_TIMEOUT: ${{ vars.VITE_API_TIMEOUT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_CONFIG_API_URL: ${{ vars.VITE_CONFIG_API_URL }}
          VITE_EMR_MIDDLEWARE_API_URL: ${{ vars.VITE_EMR_MIDDLEWARE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_ENABLE_SITE_CAPTCHA: ${{ vars.VITE_ENABLE_SITE_CAPTCHA }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          VITE_PORTAL_SOCKET_URL: ${{ vars.VITE_PORTAL_SOCKET_URL }}
          VITE_WEBRTC_SDK_SERVER_URL: ${{ vars.VITE_WEBRTC_SDK_SERVER_URL }}
          VITE_WEBRTC_API_URL: ${{ vars.VITE_WEBRTC_API_URL }}
        run: |
          echo "Building with Vite..."
          yarn build
          if [ ! -f dist/index.html ]; then
            echo "❌ Build output missing dist/index.html"
            exit 1
          fi

      - name: 🔐 Setup SSH
        env:
          SERVER_PEM_KEY: ${{ secrets.SERVER_PEM_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          # Optional but recommended: output of `ssh-keyscan -H <host>` run once from a trusted machine
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          echo "🔐 Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_PEM_KEY" > ~/.ssh/dev_server.pem
          chmod 600 ~/.ssh/dev_server.pem

          if [ -n "$SERVER_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SERVER_KNOWN_HOSTS secret not set - trusting the host key returned by ssh-keyscan"
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          # ControlMaster: rsync and the deploy script reuse one SSH connection
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/dev_server.pem
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ServerAliveInterval 30
            ConnectTimeout 15
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120
          EOF
          chmod 600 ~/.ssh/config
          echo "✅ SSH setup completed!"

      # Staging dir persists between runs, so rsync only uploads changed files.
      # --rsync-path creates it on first run (no separate SSH call needed).
      - name: 📤 Upload build to staging directory
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          STAGING_PATH="${DEPLOY_PATH%/}.staging"
          Q_STAGING=$(printf '%q' "$STAGING_PATH")
          Q_USER=$(printf '%q' "$SERVER_USER")

          echo "📤 Uploading build files..."
          rsync -az --delete --stats \
            --rsync-path="sudo mkdir -p $Q_STAGING && sudo chown $Q_USER $Q_STAGING && rsync" \
            dist/ "deploy-target:${STAGING_PATH}/"

      # Releases + symlink: each deploy is a new folder under BACKUP_PATH, and
      # DEPLOY_PATH is a symlink to the current one. The swap is atomic and the
      # previous releases double as backups (no separate backup copy needed).
      - name: 🚀 Activate release on Development Server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKUP_PATH: ${{ secrets.BACKUP_PATH }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          RELEASES_PATH="${BACKUP_PATH%/}"
          STAGING_PATH="${DEPLOY_PATH}.staging"
          KEEP_RELEASES=5

          ssh deploy-target "bash -s -- $(printf '%q ' "$DEPLOY_PATH" "$RELEASES_PATH" "$STAGING_PATH" "$KEEP_RELEASES")" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"; RELEASES_PATH="$2"; STAGING_PATH="$3"; KEEP_RELEASES="$4"

          if [ ! -f "$STAGING_PATH/index.html" ]; then
            echo "❌ Staging directory has no index.html - aborting"
            exit 1
          fi

          sudo mkdir -p "$RELEASES_PATH" "$(dirname "$DEPLOY_PATH")"

          # One-time migration: if the live site is still a real folder, move it
          # into the releases folder and replace it with a symlink.
          if [ -d "$DEPLOY_PATH" ] && [ ! -L "$DEPLOY_PATH" ]; then
            LEGACY="$RELEASES_PATH/$(date +%Y%m%d-%H%M%S)-legacy"
            echo "🔁 Migrating existing site to $LEGACY"
            sudo mv "$DEPLOY_PATH" "$LEGACY"
            sudo ln -s "$LEGACY" "$DEPLOY_PATH"
          fi

          # 1. Build the new release from staging (server-side copy, fast)
          RELEASE="$RELEASES_PATH/$(date +%Y%m%d-%H%M%S)"
          echo "📦 Creating release $RELEASE"
          sudo cp -a "$STAGING_PATH" "$RELEASE"
          sudo find "$RELEASE" -type d -exec chmod 755 {} +
          sudo find "$RELEASE" -type f -exec chmod 644 {} +
          sudo chown -R www-data:www-data "$RELEASE"

          # 2. Atomic swap: build the new symlink beside the old one, then rename over it
          sudo ln -sfn "$RELEASE" "$DEPLOY_PATH.next"
          sudo mv -Tf "$DEPLOY_PATH.next" "$DEPLOY_PATH"
          echo "🔄 Live site now points to $(readlink "$DEPLOY_PATH")"

          # 3. Keep only the newest releases (never the live one)
          CURRENT="$(readlink -f "$DEPLOY_PATH")"
          sudo find "$RELEASES_PATH" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort -r | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r old; do
                [ "$(readlink -f "$RELEASES_PATH/$old")" = "$CURRENT" ] && continue
                sudo rm -rf -- "${RELEASES_PATH:?}/$old"
              done

          echo "📊 Files deployed: $(sudo find "$CURRENT" -type f | wc -l)"
          echo "✅ Development deployment completed successfully!"
          REMOTE

      - name: 📧 Notify deployment to Slack
        if: always() && (vars.SEND_NOTIFICATIONS == 'true' || vars.SEND_NOTIFICATIONS == '1')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set - skipping notification"
            exit 0
          fi

          case "$JOB_STATUS" in
            success)   EMOJI="✅"; COLOR="good";    TEXT="SUCCESS" ;;
            cancelled) EMOJI="⚪"; COLOR="#999999"; TEXT="CANCELLED" ;;
            *)         EMOJI="❌"; COLOR="danger";  TEXT="FAILED" ;;
          esac

          DEPLOYMENT_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          # Build JSON with jq so special characters can't break the payload
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg color "$COLOR" \
            --arg title "$EMOJI Development Deployment $TEXT" \
            --arg run_url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "<$COMMIT_URL|${SHA:0:7}>" \
            --arg actor "$ACTOR" \
            --arg time "$DEPLOYMENT_TIME" \
            --argjson ts "$(date +%s)" \
            '{
              username: "GitHub Actions",
              icon_emoji: ":rocket:",
              attachments: [{
                color: $color, title: $title, title_link: $run_url,
                fields: [
                  {title: "Repository",      value: $repo,   short: true},
                  {title: "Branch",          value: $branch, short: true},
                  {title: "Commit",          value: $commit, short: true},
                  {title: "Author",          value: $actor,  short: true},
                  {title: "Environment",     value: "Development (TTXAI)", short: true},
                  {title: "Deployment Time", value: $time,   short: true}
                ],
                footer: "GitHub Actions",
                ts: $ts
              }]
            } + (if $channel != "" then {channel: $channel} else {} end)')

          if curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"; then
            echo "✅ Slack notification sent"
          else
            echo "::warning::Slack notification failed"
          fi
