name: 🚀 Deploy to TTXAI

# Deploys on every push to dev (tests run inside this job), or manually.
# The workflow_run trigger was removed: combined with `push` it deployed twice,
# and on workflow_run the checkout used the default branch instead of the tested commit.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Never run two deploys against the same server at once
concurrency:
  group: deploy-ttxai
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22.18.0'
  DEPLOY_ENV: 'development'

jobs:
  deploy-dev:
    name: Deploy to TTXAI Server
    runs-on: ubuntu-latest
    environment: ttxai

    steps:
      - name: ✅ Validate required secrets
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKUP_PATH: ${{ secrets.BACKUP_PATH }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PEM_KEY: ${{ secrets.SERVER_PEM_KEY }}
        run: |
          missing=0
          for name in DEPLOY_PATH BACKUP_PATH SERVER_HOST SERVER_USER SERVER_PEM_KEY; do
            if [ -z "${!name}" ]; then
              echo "❌ Error: $name secret is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # Guard against paths that would make rsync --delete destructive
          for name in DEPLOY_PATH BACKUP_PATH; do
            p="${!name%/}"
            case "$p" in
              ""|"/"|"/home"|"/var"|"/var/www"|"/usr"|"/etc"|"/root")
                echo "❌ Error: $name points to an unsafe location"
                exit 1 ;;
            esac
          done
          if [ "${DEPLOY_PATH%/}" = "${BACKUP_PATH%/}" ]; then
            echo "❌ Error: DEPLOY_PATH and BACKUP_PATH must be different"
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🧪 Run tests with conditional coverage
        env:
          BYPASS_COVERAGE_CHECK: ${{ secrets.BYPASS_COVERAGE_CHECK }}
        run: |
          echo "🧪 Running tests..."
          if [ "$BYPASS_COVERAGE_CHECK" = "true" ]; then
            echo "⚠️ Coverage check bypassed - running tests without coverage requirements"
            yarn test:coverage:bypass
          else
            echo "✅ Running tests with 100% coverage requirement"
            yarn test:coverage
          fi

      - name: 📊 Analyze bundle
        run: yarn analyze

      # - name: 🔒 Security audit
      #   run: |
      #     echo "🔍 Running development security audit..."
      #     yarn audit --audit-level high

      - name: 🏗️ Build for development
        env:
          VITE_APP_ENV: development
          VITE_DEBUG_MODE: 'true'
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_AUTH_GATEWAY_API_URL: ${{ vars.VITE_AUTH_GATEWAY_API_URL }}
          VITE_OPENMRS_API_URL: ${{ vars.VITE_OPENMRS_API_URL }}
          VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}
          VITE_API_TIMEOUT: ${{ vars.VITE_API_TIMEOUT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_CONFIG_API_URL: ${{ vars.VITE_CONFIG_API_URL }}
          VITE_EMR_MIDDLEWARE_API_URL: ${{ vars.VITE_EMR_MIDDLEWARE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_ENABLE_SITE_CAPTCHA: ${{ vars.VITE_ENABLE_SITE_CAPTCHA }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          VITE_PORTAL_SOCKET_URL: ${{ vars.VITE_PORTAL_SOCKET_URL }}
          VITE_WEBRTC_SDK_SERVER_URL: ${{ vars.VITE_WEBRTC_SDK_SERVER_URL }}
          VITE_WEBRTC_API_URL: ${{ vars.VITE_WEBRTC_API_URL }}
        run: |
          echo "Building with Vite..."
          yarn build
          if [ ! -f dist/index.html ]; then
            echo "❌ Build output missing dist/index.html"
            exit 1
          fi

      - name: 🔐 Setup SSH
        env:
          SERVER_PEM_KEY: ${{ secrets.SERVER_PEM_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          # Optional but recommended: output of `ssh-keyscan -H <host>` run once from a trusted machine
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          echo "🔐 Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_PEM_KEY" > ~/.ssh/dev_server.pem
          chmod 600 ~/.ssh/dev_server.pem

          if [ -n "$SERVER_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SERVER_KNOWN_HOSTS secret not set - trusting the host key returned by ssh-keyscan"
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/dev_server.pem
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config
          echo "✅ SSH setup completed!"

      - name: 🧪 Test Server Connection
        run: |
          echo "🧪 Testing connection to development server..."
          ssh deploy-target "echo 'Connection successful!'"

      - name: 📤 Upload build to staging directory
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          # Staging lives NEXT TO the web root, so half-uploaded files are never served
          STAGING_PATH="${DEPLOY_PATH}.staging"

          ssh deploy-target "bash -s -- $(printf '%q ' "$STAGING_PATH" "$SERVER_USER")" <<'REMOTE'
          set -euo pipefail
          STAGING_PATH="$1"; SERVER_USER="$2"
          sudo mkdir -p "$STAGING_PATH"
          sudo chown -R "$SERVER_USER:$SERVER_USER" "$STAGING_PATH"
          sudo chmod 755 "$STAGING_PATH"
          REMOTE

          echo "📤 Uploading build files..."
          rsync -az --delete --stats dist/ "deploy-target:${STAGING_PATH}/"

      - name: 🚀 Deploy to Development Server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKUP_PATH: ${{ secrets.BACKUP_PATH }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          BACKUP_PATH="${BACKUP_PATH%/}"
          STAGING_PATH="${DEPLOY_PATH}.staging"
          KEEP_BACKUPS=5

          ssh deploy-target "bash -s -- $(printf '%q ' "$DEPLOY_PATH" "$BACKUP_PATH" "$STAGING_PATH" "$KEEP_BACKUPS")" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"; BACKUP_PATH="$2"; STAGING_PATH="$3"; KEEP_BACKUPS="$4"

          if [ ! -f "$STAGING_PATH/index.html" ]; then
            echo "❌ Staging directory has no index.html - aborting"
            exit 1
          fi

          sudo mkdir -p "$DEPLOY_PATH" "$BACKUP_PATH"

          # 1. Timestamped backup of the live site (including hidden files)
          SNAPSHOT=""
          if [ -n "$(sudo ls -A "$DEPLOY_PATH")" ]; then
            SNAPSHOT="$BACKUP_PATH/$(date +%Y%m%d-%H%M%S)"
            echo "📦 Backing up current deployment to $SNAPSHOT"
            sudo rsync -a --exclude='temp/' "$DEPLOY_PATH/" "$SNAPSHOT/"
            # Keep only the newest backups
            sudo find "$BACKUP_PATH" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort -r | tail -n +$((KEEP_BACKUPS + 1)) \
              | while read -r old; do sudo rm -rf -- "$BACKUP_PATH/$old"; done
          else
            echo "ℹ️ No existing deployment to back up"
          fi

          # 2. Normalise permissions in staging before it goes live
          find "$STAGING_PATH" -type d -exec chmod 755 {} +
          find "$STAGING_PATH" -type f -exec chmod 644 {} +

          # 3. Swap in the new build. --delay-updates puts all changed files in place at the
          #    end, and --delete-after removes stale files only once the new ones are live.
          echo "🔄 Syncing staging to live directory..."
          if ! sudo rsync -a --delete-after --delay-updates "$STAGING_PATH/" "$DEPLOY_PATH/"; then
            echo "❌ Sync failed"
            if [ -n "$SNAPSHOT" ]; then
              echo "↩️ Restoring previous deployment from $SNAPSHOT"
              sudo rsync -a --delete "$SNAPSHOT/" "$DEPLOY_PATH/"
              sudo chown -R www-data:www-data "$DEPLOY_PATH"
            fi
            exit 1
          fi

          sudo chown -R www-data:www-data "$DEPLOY_PATH"
          sudo chmod 755 "$DEPLOY_PATH"

          echo "📊 Files deployed: $(sudo find "$DEPLOY_PATH" -type f | wc -l)"
          echo "✅ Development deployment completed successfully!"
          REMOTE

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Removing SSH credentials..."
          rm -f ~/.ssh/dev_server.pem ~/.ssh/config ~/.ssh/known_hosts

      - name: 📧 Notify deployment to Slack
        if: always() && (vars.SEND_NOTIFICATIONS == 'true' || vars.SEND_NOTIFICATIONS == '1')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set - skipping notification"
            exit 0
          fi

          case "$JOB_STATUS" in
            success)   EMOJI="✅"; COLOR="good";    TEXT="SUCCESS" ;;
            cancelled) EMOJI="⚪"; COLOR="#999999"; TEXT="CANCELLED" ;;
            *)         EMOJI="❌"; COLOR="danger";  TEXT="FAILED" ;;
          esac

          DEPLOYMENT_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          # Build JSON with jq so special characters can't break the payload
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg color "$COLOR" \
            --arg title "$EMOJI Development Deployment $TEXT" \
            --arg run_url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "<$COMMIT_URL|${SHA:0:7}>" \
            --arg actor "$ACTOR" \
            --arg time "$DEPLOYMENT_TIME" \
            --argjson ts "$(date +%s)" \
            '{
              username: "GitHub Actions",
              icon_emoji: ":rocket:",
              attachments: [{
                color: $color, title: $title, title_link: $run_url,
                fields: [
                  {title: "Repository",      value: $repo,   short: true},
                  {title: "Branch",          value: $branch, short: true},
                  {title: "Commit",          value: $commit, short: true},
                  {title: "Author",          value: $actor,  short: true},
                  {title: "Environment",     value: "Development (TTXAI)", short: true},
                  {title: "Deployment Time", value: $time,   short: true}
                ],
                footer: "GitHub Actions",
                ts: $ts
              }]
            } + (if $channel != "" then {channel: $channel} else {} end)')

          if curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"; then
            echo "✅ Slack notification sent"
          else
            echo "::warning::Slack notification failed"
          fi
